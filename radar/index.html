<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LD2450 Radar</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 29 3.5 7.5a24 24 0 0 1 25 0Z' fill='%232dd4bf' fill-opacity='.3' stroke='%232dd4bf' stroke-width='1.5'/%3E%3Ccircle cx='17' cy='13' r='3.2' fill='%23f59e0b'/%3E%3C/svg%3E">
<style>
:root {
  --bg: #080b10;
  --panel: #0e131a;
  --panel-2: #141b24;
  --line: rgba(148, 163, 184, 0.13);
  --line-2: rgba(148, 163, 184, 0.24);
  --text: #e6edf3;
  --muted: #8a97a8;
  --dim: #566173;
  --accent: #2dd4bf;
  --ok: #34d399;
  --warn: #fbbf24;
  --bad: #f87171;
  --t1: #2dd4bf;
  --t2: #f59e0b;
  --t3: #f472b6;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); }
body { font: 14px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Ubuntu, sans-serif; min-height: 100vh; }
.num { font-variant-numeric: tabular-nums; }
button { font: inherit; }

header {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding: 14px 20px; border-bottom: 1px solid var(--line);
  background: linear-gradient(180deg, rgba(45, 212, 191, 0.05), transparent);
}
.brand { display: flex; align-items: center; gap: 11px; margin-right: auto; min-width: 0; }
.brand svg { flex: none; }
.brand h1 { margin: 0; font-size: 16px; font-weight: 650; letter-spacing: 0.2px; }
.brand small { display: block; color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.pill {
  display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 999px;
  background: var(--panel-2); border: 1px solid var(--line); font-size: 13px; white-space: nowrap;
}
.pill .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); }
.pill.live .dot { background: var(--ok); animation: pulse 1.6s infinite; }
.pill.warn .dot { background: var(--warn); }
.pill.bad .dot { background: var(--bad); }
@keyframes pulse {
  0% { box-shadow: 0 0 0 0 rgba(52, 211, 153, 0.55); }
  70% { box-shadow: 0 0 0 8px rgba(52, 211, 153, 0); }
  100% { box-shadow: 0 0 0 0 rgba(52, 211, 153, 0); }
}

.seg { display: inline-flex; background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
.seg button, .tog {
  border: 0; background: none; color: var(--muted); cursor: pointer;
  padding: 5px 11px; border-radius: 7px; font-size: 13px; white-space: nowrap;
}
.seg button:hover, .tog:hover { color: var(--text); }
.seg button.on { background: #1f2a37; color: var(--text); box-shadow: inset 0 0 0 1px var(--line-2); }
.seg button:disabled { opacity: 0.55; cursor: progress; }
.tog { background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 6px 12px; }
.tog[aria-pressed="true"] { color: var(--text); border-color: rgba(45, 212, 191, 0.5); background: rgba(45, 212, 191, 0.1); }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

main {
  display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px;
  padding: 16px 20px 24px; max-width: 1560px; margin: 0 auto;
}
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; }
.card h2 { margin: 0; font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.7px; }

.radar { position: relative; aspect-ratio: 16 / 10; min-height: 300px; overflow: hidden; }
.radar canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.overlay { position: absolute; left: 18px; top: 16px; pointer-events: none; }
.count { font-size: 44px; font-weight: 700; line-height: 1; }
.count-label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.6px; margin-top: 4px; }
.legend-fov { position: absolute; right: 16px; top: 16px; color: var(--dim); font-size: 12px; text-align: right; pointer-events: none; }
.radar-msg {
  position: absolute; left: 50%; top: 46%; transform: translate(-50%, -50%); max-width: min(420px, 86%);
  padding: 12px 16px; border-radius: 12px; text-align: center; font-size: 14px;
  background: rgba(8, 11, 16, 0.86); border: 1px solid var(--line-2); color: var(--text);
}
.radar-msg[hidden] { display: none; }

.side { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.target { position: relative; overflow: hidden; padding: 12px 14px 12px 17px; transition: opacity 0.4s; }
.target::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--c); }
.target .top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.target h3 { margin: 0; display: flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.6px; }
.target h3 i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); box-shadow: 0 0 10px var(--c); }
.motion { font-size: 12px; padding: 2px 9px; border-radius: 999px; background: var(--panel-2); color: var(--muted); border: 1px solid var(--line); }
.motion.in { color: #fda4af; border-color: rgba(253, 164, 175, 0.35); }
.motion.out { color: #93c5fd; border-color: rgba(147, 197, 253, 0.35); }
.motion.cross { color: #fcd34d; border-color: rgba(252, 211, 77, 0.35); }
.dist { margin-top: 4px; font-size: 30px; font-weight: 700; line-height: 1.1; }
.dist span { font-size: 14px; color: var(--muted); font-weight: 500; margin-left: 3px; }
.kv { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px 10px; margin-top: 8px; }
.kv div { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.4px; }
.kv b { display: block; color: var(--text); font-size: 14px; font-weight: 600; text-transform: none; letter-spacing: 0; }
.target.empty { opacity: 0.42; }
.target.empty .kv b { color: var(--dim); }

.stats { padding: 14px; }
.stats dl { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; margin: 10px 0 0; }
.stats dt { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.4px; }
.stats dd { margin: 1px 0 0; font-weight: 600; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.timeline { padding: 14px 14px 10px; min-width: 0; }
.timeline .head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.keys { display: flex; gap: 14px; font-size: 12px; color: var(--muted); }
.keys span { display: inline-flex; align-items: center; gap: 6px; }
.keys i { width: 14px; height: 3px; border-radius: 2px; background: var(--c); }
.timeline canvas { width: 100%; height: 170px; display: block; margin-top: 8px; }

.feed { padding: 14px; min-width: 0; display: flex; flex-direction: column; }
.feed ol { list-style: none; margin: 10px 0 0; padding: 0; overflow-y: auto; max-height: 180px; flex: 1; }
.feed li { display: grid; grid-template-columns: auto auto 1fr; align-items: baseline; gap: 8px; padding: 5px 0; border-top: 1px solid var(--line); font-size: 13px; }
.feed li:first-child { border-top: 0; }
.feed time { color: var(--dim); font-size: 12px; }
.feed li i { width: 7px; height: 7px; border-radius: 50%; background: var(--c, var(--dim)); align-self: center; }
.feed .empty-feed { color: var(--dim); display: block; }

@media (max-width: 1000px) {
  main { grid-template-columns: 1fr; }
  .side { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
}
@media (max-width: 600px) {
  header { padding: 12px 16px; }
  main { padding: 12px 16px 20px; gap: 12px; }
  .radar { aspect-ratio: 4 / 3; }
  .count { font-size: 34px; }
  .legend-fov { display: none; }
}
</style>
</head>
<body>
<header>
  <div class="brand">
    <svg width="34" height="34" viewBox="0 0 32 32" aria-hidden="true">
      <path d="M16 29 3.5 7.5a24 24 0 0 1 25 0Z" fill="#2dd4bf" fill-opacity=".18" stroke="#2dd4bf" stroke-width="1.3"/>
      <path d="M16 29 9.7 18a12 12 0 0 1 12.6 0Z" fill="none" stroke="#2dd4bf" stroke-opacity=".5"/>
      <circle cx="18" cy="12.5" r="2.6" fill="#f59e0b"/>
    </svg>
    <div><h1>LD2450 Radar</h1><small id="sub">24 GHz mmWave · up to 3 targets</small></div>
  </div>
  <div class="pill" id="status"><span class="dot"></span><span id="statusText">Connecting…</span></div>
  <div class="controls">
    <div class="seg" id="modeSeg" title="Tracking mode, sent to the sensor">
      <button data-mode="multi">Multi</button><button data-mode="single">Single</button>
    </div>
    <div class="seg" id="rangeSeg" title="Display range">
      <button data-range="3000">3 m</button><button data-range="6000">6 m</button><button data-range="8000">8 m</button>
    </div>
    <button class="tog" id="tTrails" aria-pressed="true">Trails</button>
    <button class="tog" id="tHeat" aria-pressed="false">Heatmap</button>
    <button class="tog" id="tMirror" aria-pressed="false" title="Flip left and right">Mirror</button>
  </div>
</header>

<main>
  <section class="card radar">
    <canvas id="radar"></canvas>
    <div class="overlay"><div class="count num" id="count">0</div><div class="count-label" id="countLabel">targets</div></div>
    <div class="legend-fov">Field of view ±60°<br>Top-down, sensor at the bottom</div>
    <div class="radar-msg" id="radarMsg" hidden></div>
  </section>

  <aside class="side">
    <div id="targets" style="display:contents"></div>
    <section class="card stats">
      <h2>Sensor</h2>
      <dl class="num">
        <div><dt>Frame rate</dt><dd id="sFps">—</dd></div>
        <div><dt>Frames</dt><dd id="sFrames">—</dd></div>
        <div><dt>Peak targets</dt><dd id="sPeak">0</dd></div>
        <div><dt>Bad frames</dt><dd id="sBad">—</dd></div>
        <div><dt>Mode</dt><dd id="sMode">—</dd></div>
        <div><dt>Firmware</dt><dd id="sFw">—</dd></div>
        <div style="grid-column: 1 / -1"><dt>Port</dt><dd id="sPort">—</dd></div>
      </dl>
    </section>
  </aside>

  <section class="card timeline">
    <div class="head">
      <h2>Distance · last 60 s</h2>
      <div class="keys">
        <span style="--c: var(--t1)"><i></i>Target 1</span>
        <span style="--c: var(--t2)"><i></i>Target 2</span>
        <span style="--c: var(--t3)"><i></i>Target 3</span>
      </div>
    </div>
    <canvas id="chart"></canvas>
  </section>

  <section class="card feed">
    <h2>Activity</h2>
    <ol id="feed"><li class="empty-feed">Waiting for the first target…</li></ol>
  </section>
</main>

<script>
(() => {
  'use strict';
  const COLORS = ['#2dd4bf', '#f59e0b', '#f472b6'];
  const FOV = Math.PI / 3;                       // ±60°
  const LEAVE_AFTER = 0.8;                       // s without a target before it counts as gone
  const $ = (id) => document.getElementById(id);
  const now = () => performance.now() / 1000;
  const store = {
    get(k, d) { try { const v = localStorage.getItem('ld2450.' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem('ld2450.' + k, JSON.stringify(v)); } catch (e) { /* private mode */ } },
  };

  const S = {
    st: {}, online: false, everOnline: false, lastMsg: 0, wasConnected: null,
    tg: [null, null, null],                      // latest raw targets
    disp: [null, null, null],                    // smoothed positions on screen {x, y, a}
    hist: [[], [], []],                          // {t, x, y, d} or {t, gap: true}
    on: [false, false, false], seen: [0, 0, 0], since: [0, 0, 0], closest: [0, 0, 0],
    peak: 0, events: [], modePending: null, bgDirty: true,
    range: store.get('range', 6000), mirror: store.get('mirror', false),
    trails: store.get('trails', true), heat: store.get('heat', false),
  };

  // ---------- formatting ----------
  const fmtM = (mm) => (mm / 1000).toFixed(2);
  const sx = (x) => (S.mirror ? -x : x);
  const angle = (x, y) => Math.atan2(sx(x), y) * 180 / Math.PI;
  const signed = (v, digits = 0) => (v > 0.5 ? '+' : v < -0.5 ? '−' : '') + Math.abs(v).toFixed(digits);
  const fmtAng = (x, y) => signed(angle(x, y)) + '°';
  const fmtDur = (s) => (s < 60 ? Math.round(s) + ' s' : Math.floor(s / 60) + ' min ' + String(Math.round(s % 60)).padStart(2, '0') + ' s');
  const hexA = (hex, a) => {
    const n = parseInt(hex.slice(1), 16);
    return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a.toFixed(3)})`;
  };

  // ---------- heatmap: 10 cm cells, x −8…8 m, y 0…8 m ----------
  const HW = 160, HH = 80, HC = 100;
  const heat = new Float32Array(HW * HH);
  const heatCv = document.createElement('canvas');
  heatCv.width = HW; heatCv.height = HH;
  const heatCtx = heatCv.getContext('2d');
  const heatImg = heatCtx.createImageData(HW, HH);
  const RAMP = [[45, 212, 191], [250, 204, 21], [239, 68, 68]];
  function heatAdd(x, y) {
    const cx = Math.floor((x + 8000) / HC), cy = Math.floor((8000 - y) / HC);
    for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) {
      const X = cx + dx, Y = cy + dy;
      if (X >= 0 && Y >= 0 && X < HW && Y < HH) heat[Y * HW + X] += Math.exp(-(dx * dx + dy * dy) / 2);
    }
  }
  function heatRender() {
    let max = 0;
    for (let i = 0; i < heat.length; i++) { heat[i] *= 0.996; if (heat[i] > max) max = heat[i]; }
    const d = heatImg.data, norm = Math.max(max, 6);
    for (let Y = 0; Y < HH; Y++) for (let X = 0; X < HW; X++) {
      const v = Math.min(1, heat[Y * HW + X] / norm);
      const o = (Y * HW + (S.mirror ? HW - 1 - X : X)) * 4;
      if (v < 0.015) { d[o + 3] = 0; continue; }
      const p = v * 2, i = Math.min(1, Math.floor(p)), f = p - i, a = RAMP[i], b = RAMP[i + 1];
      d[o] = a[0] + (b[0] - a[0]) * f; d[o + 1] = a[1] + (b[1] - a[1]) * f; d[o + 2] = a[2] + (b[2] - a[2]) * f;
      d[o + 3] = 230 * Math.sqrt(v);
    }
    heatCtx.putImageData(heatImg, 0, 0);
  }

  // ---------- target cards ----------
  const cards = [0, 1, 2].map((k) => {
    const el = document.createElement('section');
    el.className = 'card target empty';
    el.style.setProperty('--c', COLORS[k]);
    el.innerHTML = `
      <div class="top"><h3><i></i>Target ${k + 1}</h3><span class="motion">no target</span></div>
      <div class="dist num"><b>—</b><span>m</span></div>
      <div class="kv num">
        <div>Angle<b data-f="ang">—</b></div><div>Left/right<b data-f="x">—</b></div><div>Forward<b data-f="y">—</b></div>
        <div>Speed<b data-f="v">—</b></div><div>Tracked<b data-f="dur">—</b></div><div>Closest<b data-f="min">—</b></div>
      </div>`;
    $('targets').appendChild(el);
    const f = {};
    el.querySelectorAll('[data-f]').forEach((b) => { f[b.dataset.f] = b; });
    return { el, f, dist: el.querySelector('.dist b'), motion: el.querySelector('.motion') };
  });

  function motionOf(k, t) {
    const h = S.hist[k];
    let last = null, past = null;
    for (let i = h.length - 1; i >= 0; i--) {
      const p = h[i];
      if (p.gap) break;
      if (!last) last = p;
      past = p;
      if (last.t - p.t >= 0.7) break;
    }
    if (!last || !past || last.t - past.t < 0.3) return ['still', ''];
    const dt = last.t - past.t;
    const planar = Math.hypot(last.x - past.x, last.y - past.y) / dt;   // mm/s
    const radial = (last.d - past.d) / dt;
    if (planar < 120) return ['still', ''];
    if (radial < -0.5 * planar) return ['approaching', 'in'];
    if (radial > 0.5 * planar) return ['moving away', 'out'];
    return ['crossing', 'cross'];
  }

  function renderCards(t) {
    let n = 0;
    for (let k = 0; k < 3; k++) {
      const c = cards[k], a = S.tg[k];
      if (S.on[k]) n++;
      if (!a) {
        if (!S.on[k]) {
          c.el.classList.add('empty');
          c.motion.textContent = 'no target'; c.motion.className = 'motion';
        }
        continue;
      }
      const d = Math.hypot(a.x, a.y);
      const [label, cls] = motionOf(k, t);
      c.el.classList.remove('empty');
      c.dist.textContent = fmtM(d);
      c.motion.textContent = label; c.motion.className = 'motion ' + cls;
      c.f.ang.textContent = fmtAng(a.x, a.y);
      c.f.x.textContent = signed(sx(a.x) / 10) + ' cm';
      c.f.y.textContent = Math.round(a.y / 10) + ' cm';
      c.f.v.textContent = Math.abs(a.v) + ' cm/s';
      c.f.dur.textContent = fmtDur(t - S.since[k]);
      c.f.min.textContent = fmtM(S.closest[k]) + ' m';
    }
    $('count').textContent = n;
    $('countLabel').textContent = n === 1 ? 'target' : 'targets';
  }

  // ---------- activity feed ----------
  function addEvent(k, text) {
    S.events.unshift({ time: new Date(), k, text });
    if (S.events.length > 50) S.events.pop();
    const ol = $('feed');
    ol.innerHTML = '';
    for (const e of S.events) {
      const li = document.createElement('li');
      const tm = document.createElement('time');
      tm.textContent = e.time.toLocaleTimeString([], { hour12: false });
      const dot = document.createElement('i');
      if (e.k >= 0) dot.style.setProperty('--c', COLORS[e.k]);
      const span = document.createElement('span');
      span.textContent = (e.k >= 0 ? `Target ${e.k + 1} ` : '') + e.text;
      li.append(tm, dot, span);
      ol.appendChild(li);
    }
  }

  // ---------- status ----------
  function isLive() { return S.online && S.st.connected && S.st.fps > 0.5; }
  function renderStatus() {
    const st = S.st, pill = $('status');
    let cls = 'bad', text = S.everOnline ? 'Server offline' : 'Connecting…';
    let msg = S.everOnline ? 'Lost the connection to the radar server. Retrying…' : 'Connecting to the radar server…';
    if (S.online) {
      if (!st.connected) {
        text = 'Sensor unplugged'; msg = 'No USB-serial adapter found. Plug in the CH340 and it will reconnect on its own.';
      } else if (!(st.fps > 0.5)) {
        cls = 'warn'; text = 'No data'; msg = 'The adapter is connected but the LD2450 is silent. Check TX→RX, GND and 5 V.';
      } else {
        cls = st.demo ? 'warn' : 'live'; msg = '';
        text = (st.demo ? 'Demo · ' : 'Live · ') + st.fps.toFixed(1) + ' Hz';
      }
    }
    pill.className = 'pill ' + cls;
    $('statusText').textContent = text;
    pill.title = st.error || '';
    $('radarMsg').hidden = !msg;
    $('radarMsg').textContent = msg;
    if (st.host) $('sub').textContent = `24 GHz mmWave · up to 3 targets · ${st.host}`;
    if (S.modePending && st.mode === S.modePending) S.modePending = null;
    renderMode();
  }
  function renderStats() {
    const st = S.st;
    $('sFps').textContent = st.fps != null ? st.fps.toFixed(1) + ' Hz' : '—';
    $('sFrames').textContent = st.frames != null ? st.frames.toLocaleString() : '—';
    $('sBad').textContent = st.bad != null ? st.bad.toLocaleString() : '—';
    $('sPeak').textContent = S.peak;
    const deaf = st.config === false;
    $('sMode').textContent = st.mode ? st.mode + '-target' : deaf ? 'read-only' : '—';
    $('sFw').textContent = st.firmware || (deaf ? 'no reply (RX)' : '—');
    $('sFw').title = deaf ? 'The sensor streams data but does not answer commands: CH340 TXD → LD2450 RX is not connected' : '';
    $('sPort').textContent = st.port || '—';
  }

  // ---------- messages from the Jetson ----------
  function onMsg(m) {
    const t = now();
    S.online = true; S.everOnline = true; S.lastMsg = t; S.st = m;
    if (S.wasConnected !== null && m.connected !== S.wasConnected) {
      addEvent(-1, m.connected ? `Sensor connected on ${m.port}` : 'Sensor disconnected');
    }
    S.wasConnected = m.connected;
    let n = 0;
    for (let k = 0; k < 3; k++) {
      const a = m.targets[k];
      const h = S.hist[k];
      if (a) {
        const d = Math.hypot(a.x, a.y);
        n++;
        if (!S.on[k]) {
          S.on[k] = true; S.since[k] = t; S.closest[k] = d;
          addEvent(k, `appeared at ${fmtM(d)} m, ${fmtAng(a.x, a.y)}`);
        }
        S.seen[k] = t;
        S.closest[k] = Math.min(S.closest[k], d);
        h.push({ t, x: a.x, y: a.y, d });
        heatAdd(a.x, a.y);
      } else {
        if (h.length && !h[h.length - 1].gap) h.push({ t, gap: true });
        if (S.on[k] && t - S.seen[k] > LEAVE_AFTER) {
          S.on[k] = false;
          addEvent(k, `left after ${fmtDur(S.seen[k] - S.since[k])}, closest ${fmtM(S.closest[k])} m`);
        }
      }
      S.tg[k] = a;
      while (h.length && h[0].t < t - 62) h.shift();
    }
    S.peak = Math.max(S.peak, n);
    heatRender();
    renderCards(t);
    renderStatus();
    renderStats();
  }

  function connect() {
    const es = new EventSource('events');
    es.onmessage = (e) => { try { onMsg(JSON.parse(e.data)); } catch (err) { console.error(err); } };
    es.onerror = () => { S.online = false; renderStatus(); };
  }

  // ---------- drawing ----------
  const bg = document.createElement('canvas');
  function fit(cv) {
    const r = cv.getBoundingClientRect(), dpr = Math.min(2, window.devicePixelRatio || 1);
    const w = Math.max(1, Math.round(r.width * dpr)), h = Math.max(1, Math.round(r.height * dpr));
    if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; return true; }
    return false;
  }
  function geom(cv) {
    const W = cv.clientWidth, H = cv.clientHeight, padTop = 36, padBottom = 42, padX = 34;
    const R = Math.max(40, Math.min(H - padTop - padBottom, (W - 2 * padX) / (2 * Math.sin(FOV))));
    return { W, H, R, ox: W / 2, oy: H - padBottom, k: R / S.range };
  }
  const toPx = (g, x, y) => [g.ox + sx(x) * g.k, g.oy - y * g.k];
  const A0 = -Math.PI / 2 - FOV, A1 = -Math.PI / 2 + FOV;
  function fanPath(ctx, g, r = g.R) { ctx.beginPath(); ctx.moveTo(g.ox, g.oy); ctx.arc(g.ox, g.oy, r, A0, A1); ctx.closePath(); }
  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }

  function drawBackground(ctx, g) {
    ctx.clearRect(0, 0, g.W, g.H);
    const glow = ctx.createRadialGradient(g.ox, g.oy, 0, g.ox, g.oy, g.R * 1.15);
    glow.addColorStop(0, 'rgba(45,212,191,0.07)'); glow.addColorStop(1, 'rgba(45,212,191,0)');
    ctx.fillStyle = glow; ctx.fillRect(0, 0, g.W, g.H);

    const fan = ctx.createRadialGradient(g.ox, g.oy, 0, g.ox, g.oy, g.R);
    fan.addColorStop(0, 'rgba(45,212,191,0.11)'); fan.addColorStop(1, 'rgba(45,212,191,0.025)');
    fanPath(ctx, g); ctx.fillStyle = fan; ctx.fill();

    ctx.font = '11px ui-sans-serif, system-ui, -apple-system, sans-serif';
    const step = S.range <= 3000 ? 500 : 1000;
    for (let r = step; r <= S.range + 1; r += step) {
      const rp = r * g.k, whole = r % 1000 === 0;
      ctx.beginPath(); ctx.arc(g.ox, g.oy, rp, A0, A1);
      ctx.strokeStyle = whole ? 'rgba(148,163,184,0.2)' : 'rgba(148,163,184,0.09)';
      ctx.lineWidth = 1; ctx.stroke();
      ctx.fillStyle = whole ? '#7b8798' : '#566173'; ctx.textAlign = 'left'; ctx.textBaseline = 'top';
      ctx.fillText((r / 1000).toFixed(whole ? 0 : 1) + ' m', g.ox + 6, g.oy - rp + 3);
    }
    for (let deg = -60; deg <= 60; deg += 15) {
      const th = (deg - 90) * Math.PI / 180, major = deg % 30 === 0;
      ctx.beginPath(); ctx.moveTo(g.ox, g.oy); ctx.lineTo(g.ox + Math.cos(th) * g.R, g.oy + Math.sin(th) * g.R);
      ctx.setLineDash(major ? [] : [3, 6]);
      ctx.strokeStyle = major ? 'rgba(148,163,184,0.16)' : 'rgba(148,163,184,0.08)'; ctx.stroke();
      ctx.setLineDash([]);
      if (major) {
        const lr = g.R + 17;
        ctx.fillStyle = '#7b8798'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText((deg > 0 ? '+' : deg < 0 ? '−' : '') + Math.abs(deg) + '°', g.ox + Math.cos(th) * lr, g.oy + Math.sin(th) * lr);
      }
    }
    for (let deg = -60; deg <= 60; deg += 5) {
      const th = (deg - 90) * Math.PI / 180, len = deg % 15 === 0 ? 7 : 4;
      ctx.beginPath();
      ctx.moveTo(g.ox + Math.cos(th) * g.R, g.oy + Math.sin(th) * g.R);
      ctx.lineTo(g.ox + Math.cos(th) * (g.R + len), g.oy + Math.sin(th) * (g.R + len));
      ctx.strokeStyle = 'rgba(45,212,191,0.45)'; ctx.stroke();
    }
    fanPath(ctx, g); ctx.strokeStyle = 'rgba(45,212,191,0.4)'; ctx.lineWidth = 1.3; ctx.stroke();

    ctx.save(); ctx.translate(g.ox, g.oy);
    ctx.shadowColor = 'rgba(45,212,191,0.6)'; ctx.shadowBlur = 12;
    roundRect(ctx, -20, -5, 40, 11, 3); ctx.fillStyle = '#132029'; ctx.fill();
    ctx.shadowBlur = 0; ctx.strokeStyle = 'rgba(45,212,191,0.85)'; ctx.lineWidth = 1.2; ctx.stroke();
    ctx.fillStyle = '#7b8798'; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    ctx.fillText('LD2450', 0, 13);
    ctx.restore();
  }

  function drawRadar(t) {
    const cv = $('radar');
    if (fit(cv)) S.bgDirty = true;
    if (!cv.clientWidth) return;
    const ctx = cv.getContext('2d'), dpr = cv.width / cv.clientWidth, g = geom(cv);
    if (S.bgDirty) {
      bg.width = cv.width; bg.height = cv.height;
      const b = bg.getContext('2d');
      b.setTransform(dpr, 0, 0, dpr, 0, 0);
      drawBackground(b, g);
      S.bgDirty = false;
    }
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, cv.width, cv.height);
    ctx.drawImage(bg, 0, 0);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    if (S.heat) {
      ctx.save(); fanPath(ctx, g); ctx.clip();
      ctx.imageSmoothingEnabled = true; ctx.globalAlpha = 0.8;
      ctx.drawImage(heatCv, g.ox - 8000 * g.k, g.oy - 8000 * g.k, 16000 * g.k, 8000 * g.k);
      ctx.restore();
    }

    if (isLive()) {
      const p = (t % 1.8) / 1.8;
      ctx.beginPath(); ctx.arc(g.ox, g.oy, p * g.R, A0, A1);
      ctx.strokeStyle = `rgba(45,212,191,${(0.3 * (1 - p)).toFixed(3)})`; ctx.lineWidth = 2; ctx.stroke();
    }

    if (S.trails) {
      ctx.save(); fanPath(ctx, g, g.R + 40); ctx.clip();
      ctx.lineCap = 'round'; ctx.lineWidth = 2.2;
      for (let k = 0; k < 3; k++) {
        const h = S.hist[k];
        let prev = null;
        for (const p of h) {
          const age = t - p.t;
          if (p.gap || age > 6) { prev = null; continue; }
          const q = toPx(g, p.x, p.y);
          if (prev && p.t - prev.t < 0.6) {
            ctx.beginPath(); ctx.moveTo(prev.q[0], prev.q[1]); ctx.lineTo(q[0], q[1]);
            ctx.strokeStyle = hexA(COLORS[k], 0.7 * (1 - age / 6)); ctx.stroke();
          }
          prev = { t: p.t, q };
        }
      }
      ctx.restore();
    }

    for (let k = 0; k < 3; k++) {
      const D = S.disp[k];
      if (!D || D.a <= 0.01) continue;
      const c = COLORS[k], [px, py] = toPx(g, D.x, D.y), a = D.a;
      ctx.setLineDash([2, 5]); ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(g.ox, g.oy); ctx.lineTo(px, py);
      ctx.strokeStyle = hexA(c, 0.28 * a); ctx.stroke(); ctx.setLineDash([]);

      const glow = ctx.createRadialGradient(px, py, 0, px, py, 34);
      glow.addColorStop(0, hexA(c, 0.5 * a)); glow.addColorStop(1, hexA(c, 0));
      ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(px, py, 34, 0, Math.PI * 2); ctx.fill();

      const ph = (t * 0.9 + k * 0.33) % 1;
      ctx.beginPath(); ctx.arc(px, py, 9 + 14 * ph, 0, Math.PI * 2);
      ctx.strokeStyle = hexA(c, 0.55 * (1 - ph) * a); ctx.lineWidth = 1.5; ctx.stroke();

      ctx.beginPath(); ctx.arc(px, py, 7.5, 0, Math.PI * 2); ctx.fillStyle = hexA(c, a); ctx.fill();
      ctx.beginPath(); ctx.arc(px, py, 2.8, 0, Math.PI * 2); ctx.fillStyle = `rgba(255,255,255,${(0.95 * a).toFixed(3)})`; ctx.fill();

      const label = `T${k + 1}  ${fmtM(Math.hypot(D.x, D.y))} m`;
      ctx.font = '600 12px ui-sans-serif, system-ui, -apple-system, sans-serif';
      const w = ctx.measureText(label).width + 16, h = 22;
      let lx = px + 14, ly = py - 30;
      if (lx + w > g.W - 6) lx = px - 14 - w;
      if (ly < 6) ly = py + 12;
      lx = Math.max(6, lx);
      ly = Math.min(ly, g.H - h - 6);
      ctx.globalAlpha = a;
      roundRect(ctx, lx, ly, w, h, 7); ctx.fillStyle = 'rgba(8,11,16,0.85)'; ctx.fill();
      ctx.strokeStyle = hexA(c, 0.6); ctx.lineWidth = 1; ctx.stroke();
      ctx.fillStyle = '#e6edf3'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
      ctx.fillText(label, lx + 8, ly + h / 2 + 0.5);
      ctx.globalAlpha = 1;
    }
  }

  function drawChart(t) {
    const cv = $('chart');
    fit(cv);
    if (!cv.clientWidth) return;
    const ctx = cv.getContext('2d'), dpr = cv.width / cv.clientWidth, W = cv.clientWidth, H = cv.clientHeight;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);
    const L = 40, R = 12, T = 8, B = 22, span = 60, maxD = S.range;
    const X = (s) => L + (W - L - R) * (1 - (t - s) / span);
    const Y = (d) => T + (H - T - B) * (1 - Math.min(d, maxD) / maxD);
    ctx.font = '11px ui-sans-serif, system-ui, -apple-system, sans-serif';
    const step = maxD <= 3000 ? 1000 : 2000;
    for (let d = 0; d <= maxD; d += step) {
      ctx.beginPath(); ctx.moveTo(L, Y(d)); ctx.lineTo(W - R, Y(d));
      ctx.strokeStyle = 'rgba(148,163,184,0.1)'; ctx.lineWidth = 1; ctx.stroke();
      ctx.fillStyle = '#6b7788'; ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
      ctx.fillText(d / 1000 + ' m', L - 8, Y(d));
    }
    for (let s = 0; s <= span; s += 15) {
      ctx.fillStyle = '#6b7788'; ctx.textAlign = s === 0 ? 'right' : 'center'; ctx.textBaseline = 'top';
      ctx.fillText(s === 0 ? 'now' : '−' + s + ' s', X(t - s), H - B + 6);
    }
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    for (let k = 0; k < 3; k++) {
      ctx.beginPath();
      let pen = false, last = -1;
      for (const p of S.hist[k]) {
        if (p.gap || p.t < t - span) { pen = false; continue; }
        const x = X(p.t), y = Y(p.d);
        if (pen && p.t - last < 0.6) ctx.lineTo(x, y); else ctx.moveTo(x, y);
        pen = true; last = p.t;
      }
      ctx.strokeStyle = COLORS[k]; ctx.lineWidth = 2; ctx.stroke();
    }
  }

  // ---------- animation ----------
  let lastT = now();
  function loop() {
    const t = now(), dt = Math.min(0.1, t - lastT);
    lastT = t;
    if (S.online && t - S.lastMsg > 3) { S.online = false; renderStatus(); }
    const blend = 1 - Math.exp(-dt / 0.09);
    for (let k = 0; k < 3; k++) {
      const a = S.tg[k];
      let D = S.disp[k];
      if (a) {
        if (!D || D.a < 0.05) D = S.disp[k] = { x: a.x, y: a.y, a: D ? D.a : 0 };
        D.x += (a.x - D.x) * blend; D.y += (a.y - D.y) * blend; D.a = Math.min(1, D.a + dt * 5);
      } else if (D) {
        D.a = Math.max(0, D.a - dt * (S.on[k] ? 0.6 : 3));
      }
    }
    drawRadar(t);
    drawChart(t);
    requestAnimationFrame(loop);
  }

  // ---------- controls ----------
  function renderMode() {
    const cur = S.modePending || S.st.mode, deaf = S.st.config === false;
    for (const b of $('modeSeg').querySelectorAll('button')) {
      b.classList.toggle('on', b.dataset.mode === cur);
      b.disabled = !!S.modePending || !!S.st.demo || !S.st.connected || deaf;
    }
    $('modeSeg').title = deaf
      ? 'The sensor does not answer commands: connect CH340 TXD to LD2450 RX to switch modes'
      : 'Tracking mode, sent to the sensor';
  }
  $('modeSeg').addEventListener('click', async (e) => {
    const b = e.target.closest('button');
    if (!b || b.disabled || b.dataset.mode === S.st.mode) return;
    S.modePending = b.dataset.mode;
    renderMode();
    addEvent(-1, `Switching the sensor to ${b.dataset.mode}-target mode…`);
    try { await fetch('mode?set=' + b.dataset.mode, { method: 'POST' }); } catch (err) { /* shown by the status */ }
    setTimeout(() => { if (S.modePending) { S.modePending = null; renderMode(); } }, 5000);
  });

  function renderRange() {
    for (const b of $('rangeSeg').querySelectorAll('button')) b.classList.toggle('on', +b.dataset.range === S.range);
  }
  $('rangeSeg').addEventListener('click', (e) => {
    const b = e.target.closest('button');
    if (!b) return;
    S.range = +b.dataset.range; store.set('range', S.range); S.bgDirty = true; renderRange();
  });

  function toggle(id, key, after) {
    const b = $(id);
    b.setAttribute('aria-pressed', String(S[key]));
    b.addEventListener('click', () => {
      S[key] = !S[key]; store.set(key, S[key]); b.setAttribute('aria-pressed', String(S[key]));
      if (after) after();
    });
  }
  toggle('tTrails', 'trails');
  toggle('tHeat', 'heat');
  toggle('tMirror', 'mirror', () => { S.bgDirty = true; heatRender(); renderCards(now()); });

  renderRange();
  renderMode();
  connect();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
