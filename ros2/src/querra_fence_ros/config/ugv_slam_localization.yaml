# slam_toolbox, localisation against the saved map (ugv.launch.py slam:=localization).
# Every patrol starts at the spawn pose, which is the map frame's origin (map_start_pose 0, 0, 0).
# The 2D scan comes from the 3D LiDAR (pointcloud_to_laserscan, 0.33-1.7 m above the ground: trunks, posts, bushes);
# the odometry prior is the wheel odometry's TF (ugv_odom -> ugv_base_link). The map frame starts at the spawn pose;
# ugv_bridge places it in the world (ugv_map -> ugv_slam_map).
# Tuned from slam_toolbox's online_async (indoor) defaults for an outdoor loop: scans count for more against the
# wheel odometry (variance and minimum penalties), a larger local map (30 scans, 20 m), larger corrections per
# step, and a 15 m loop-closure search (the drift reaches several metres before the loop closes).
slam_toolbox:
  ros__parameters:
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None
    odom_frame: ugv_odom
    map_frame: ugv_slam_map
    base_frame: ugv_base_link
    scan_topic: /ugv/scan
    mode: localization
    map_file_name: /ws/maps/forest
    map_start_pose: [0.0, 0.0, 0.0]
    debug_logging: false
    throttle_scans: 1
    transform_publish_period: 0.05
    map_update_interval: 5.0
    resolution: 0.05
    max_laser_range: 20.0
    minimum_time_interval: 0.2
    transform_timeout: 0.2
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000
    enable_interactive_mode: false
    use_scan_matching: true
    use_scan_barycenter: true
    minimum_travel_distance: 0.3
    minimum_travel_heading: 0.2
    scan_buffer_size: 30
    scan_buffer_maximum_scan_distance: 20.0
    link_match_minimum_response_fine: 0.1
    link_scan_maximum_distance: 3.0
    loop_search_maximum_distance: 15.0
    do_loop_closing: true
    scan_queue_size: 1
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45
    correlation_search_space_dimension: 0.8
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1
    loop_search_space_dimension: 16.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03
    distance_variance_penalty: 0.3
    angle_variance_penalty: 0.4
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0175
    minimum_angle_penalty: 0.5
    minimum_distance_penalty: 0.3
    use_response_expansion: true
