<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Querra Fence: a shield (protection) around an electric fence (posts, live wires, spark), seen from the drone
       above (scan arcs), on a pasture at dusk. Built to stay readable at 48 px in the GNOME dock. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#15493a"/><stop offset="0.55" stop-color="#0c2a2a"/><stop offset="1" stop-color="#081419"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#ffd84a" stop-opacity="0.32"/><stop offset="1" stop-color="#ffd84a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff0a0"/><stop offset="0.5" stop-color="#ffd23f"/><stop offset="1" stop-color="#f0a500"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#173246"/><stop offset="1" stop-color="#0a1823"/>
    </linearGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2fae6a"/><stop offset="1" stop-color="#14583a"/>
    </linearGradient>
    <clipPath id="tile"><rect x="8" y="8" width="240" height="240" rx="56"/></clipPath>
  </defs>

  <g clip-path="url(#tile)">
    <rect x="8" y="8" width="240" height="240" fill="url(#bg)"/>
    <rect x="8" y="8" width="240" height="240" fill="url(#glow)"/>
    <!-- drone scan arcs above the shield -->
    <g fill="none" stroke="#7fe3b0" stroke-linecap="round" opacity="0.55">
      <path d="M86 40 A60 60 0 0 1 170 40" stroke-width="5"/>
      <path d="M104 52 A34 34 0 0 1 152 52" stroke-width="5"/>
    </g>
    <!-- pasture -->
    <path d="M8 206 Q70 186 128 198 Q190 210 248 190 V248 H8 Z" fill="url(#hill)" opacity="0.9"/>
  </g>

  <!-- shield -->
  <path d="M128 58 L192 80 V128 C192 170 164 196 128 212 C92 196 64 170 64 128 V80 Z"
        fill="url(#shield)" stroke="url(#gold)" stroke-width="9" stroke-linejoin="round"/>

  <!-- fence inside the shield: two posts, two live wires -->
  <g stroke="#cfd9e3" stroke-width="9" stroke-linecap="round">
    <line x1="95" y1="118" x2="95" y2="178"/>
    <line x1="161" y1="118" x2="161" y2="178"/>
  </g>
  <g stroke="url(#gold)" stroke-width="6" stroke-linecap="round" fill="none">
    <path d="M95 134 Q128 141 161 134"/>
    <path d="M95 160 Q128 167 161 160"/>
  </g>

  <!-- spark: the fence is live -->
  <path d="M136 92 L112 140 H128 L118 182 L148 124 H131 L142 92 Z"
        fill="#fffbe6" stroke="#f0a500" stroke-width="4" stroke-linejoin="round"/>

  <!-- tile edge -->
  <rect x="9.5" y="9.5" width="237" height="237" rx="55" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="3"/>
</svg>
